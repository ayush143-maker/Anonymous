<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>void</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      background: #000;
      color: #0f0;
      font-family: 'Courier New', Courier, monospace;
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
    }
    #header {
      padding: 12px 14px;
      border-bottom: 1px solid #0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      opacity: 0.7;
      flex-shrink: 0;
      min-height: 44px;
      background: #000;
      z-index: 10;
    }
    #log {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 14px;
      -webkit-overflow-scrolling: touch;
      word-break: break-word;
      overscroll-behavior-y: contain;
    }
    .msg {
      margin-bottom: 16px;
      animation: in 0.18s ease-out;
      font-size: 13px;
    }
    @keyframes in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.out {
      animation: out 0.35s ease-in forwards;
    }
    @keyframes out {
      to { opacity: 0; transform: translateX(-30px); max-height: 0; margin: 0; padding: 0; }
    }
    .json-comment {
      color: #444;
      font-size: 10px;
      margin-bottom: 2px;
      letter-spacing: 0.3px;
    }
    .json-key { color: #0f0; }
    .json-str { color: #0ff; }
    #input-area {
      border-top: 1px solid #0f0;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      min-height: 52px;
      background: #000;
      z-index: 10;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
    }
    .prompt {
      color: #0f0;
      opacity: 0.4;
      font-size: 16px;
      user-select: none;
      flex-shrink: 0;
    }
    #inp {
      flex: 1;
      background: transparent;
      border: none;
      color: #0f0;
      font-family: inherit;
      font-size: 16px;
      outline: none;
      caret-color: #0f0;
      min-width: 0;
      padding: 4px 0;
    }
    #inp::placeholder { color: #0f0; opacity: 0.25; font-size: 14px; }
    #send-btn {
      background: transparent;
      border: 1px solid #0f0;
      color: #0f0;
      font-family: inherit;
      font-size: 11px;
      padding: 6px 12px;
      cursor: pointer;
      opacity: 0.6;
      flex-shrink: 0;
    }
    #send-btn:active { opacity: 1; background: #0f0; color: #000; }
    #log::-webkit-scrollbar { display: none; }
    #log { scrollbar-width: none; -ms-overflow-style: none; }
    @media (max-height: 400px) {
      #header { padding: 6px 14px; min-height: 36px; font-size: 10px; }
      #input-area { min-height: 44px; padding: 6px 14px; }
      .msg { margin-bottom: 10px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <span id="uid">id: ...</span>
      <span id="status">...</span>
    </div>
    <div id="log"></div>
    <div id="input-area">
      <span class="prompt">></span>
      <input id="inp" type="text" placeholder="type..." autocomplete="off" autofocus spellcheck="false" inputmode="text" enterkeyhint="send">
      <button id="send-btn">SEND</button>
    </div>
  </div>

  <script type="module">
    import mqtt from 'https://unpkg.com/mqtt/dist/mqtt.esm.js';
    const uid = Math.random().toString(36).slice(2, 10);
    document.getElementById('uid').textContent = 'id: ' + uid;
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    const inp = document.getElementById('inp');
    const sendBtn = document.getElementById('send-btn');
    const T_MSG = 'voidbox/m/v2';
    const T_PRES = 'voidbox/p/v2';
    const HB = 4000;
    const TO = 12000;
    const msgs = new Map();
    const userMsgs = new Map();
    const users = new Map();
    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
      clientId: 'v_' + uid + '_' + Date.now(),
      clean: true,
      reconnectPeriod: 3000,
    });
    client.on('connect', () => {
      statusEl.textContent = 'online | 0 active';
      statusEl.style.color = '#0f0';
      client.subscribe([T_MSG, T_PRES]);
      beat();
    });
    client.on('disconnect', () => {
      statusEl.textContent = 'offline';
      statusEl.style.color = '#f00';
    });
    client.on('error', () => {
      statusEl.textContent = 'error';
      statusEl.style.color = '#f00';
    });
    client.on('message', (topic, payload) => {
      try {
        const d = JSON.parse(payload.toString());
        if (topic === T_MSG) onMsg(d);
        if (topic === T_PRES) onPres(d);
      } catch(e) {}
    });
    function onMsg(d) {
      if (!d.u || !d.t || !d.m) return;
      if (msgs.has(d.m)) return;
      const el = document.createElement('div');
      el.className = 'msg';
      const tm = new Date(d.ts).toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
      el.innerHTML = `<div class="json-comment">// ${d.u.slice(0,6)} @ ${tm}</div>{<br>&nbsp;&nbsp;<span class="json-key">"from"</span>: <span class="json-str">"${esc(d.u)}"</span>,<br>&nbsp;&nbsp;<span class="json-key">"text"</span>: <span class="json-str">"${esc(d.t)}"</span>,<br>&nbsp;&nbsp;<span class="json-key">"time"</span>: <span class="json-str">"${tm}"</span><br>}`;
      logEl.appendChild(el);
      logEl.scrollTop = logEl.scrollHeight;
      msgs.set(d.m, {el, u: d.u});
      if (!userMsgs.has(d.u)) userMsgs.set(d.u, new Set());
      userMsgs.get(d.u).add(d.m);
    }
    function onPres(d) {
      if (!d.u) return;
      users.set(d.u, Date.now());
      updateStatus();
    }
    function beat() {
      client.publish(T_PRES, JSON.stringify({u: uid, ts: Date.now()}));
    }
    setInterval(beat, HB);
    setInterval(checkUsers, 5000);
    function checkUsers() {
      const now = Date.now();
      let changed = false;
      for (const [id, last] of users) {
        if (now - last > TO) {
          if (userMsgs.has(id)) {
            for (const mid of userMsgs.get(id)) {
              if (msgs.has(mid)) {
                const o = msgs.get(mid);
                o.el.classList.add('out');
                setTimeout(() => o.el.remove(), 400);
                msgs.delete(mid);
              }
            }
            userMsgs.delete(id);
          }
          users.delete(id);
          changed = true;
        }
      }
      if (changed) updateStatus();
    }
    function updateStatus() {
      statusEl.textContent = 'online | ' + users.size + ' active';
    }
    function send() {
      const t = inp.value.trim();
      if (!t) return;
      const mid = uid + '_' + Date.now();
      client.publish(T_MSG, JSON.stringify({u: uid, m: mid, t: t, ts: Date.now()}));
      inp.value = '';
      inp.focus();
    }
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    sendBtn.addEventListener('click', send);
    function esc(s) {
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    if ('visualViewport' in window) {
      window.visualViewport.addEventListener('resize', () => {
        document.body.style.height = window.visualViewport.height + 'px';
        setTimeout(() => logEl.scrollTop = logEl.scrollHeight, 100);
      });
    }
  </script>
</body>
</html>
