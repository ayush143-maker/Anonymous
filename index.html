<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>void</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #0f0;
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 13px;
      line-height: 1.5;
      overflow: hidden;
    }
    #header {
      padding: 10px 16px;
      border-bottom: 1px solid #0f0;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      opacity: 0.8;
      flex-shrink: 0;
    }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .msg {
      margin-bottom: 14px;
      animation: in 0.15s ease;
      word-break: break-word;
    }
    @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .msg.out {
      animation: out 0.4s ease forwards;
    }
    @keyframes out { to { opacity: 0; transform: translateX(-20px); max-height: 0; margin: 0; } }
    .json-comment { color: #555; font-size: 11px; }
    .json-key { color: #0f0; }
    .json-str { color: #0ff; }
    #input-area {
      border-top: 1px solid #0f0;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    #inp {
      flex: 1;
      background: transparent;
      border: none;
      color: #0f0;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      caret-color: #0f0;
    }
    #inp::placeholder { color: #0f0; opacity: 0.3; }
    .prompt { color: #0f0; opacity: 0.5; user-select: none; }
  </style>
</head>
<body>
  <div id="header">
    <span id="uid">id: ...</span>
    <span id="status">connecting...</span>
  </div>
  <div id="log"></div>
  <div id="input-area">
    <span class="prompt">></span>
    <input id="inp" type="text" placeholder="type and press enter" autocomplete="off" autofocus spellcheck="false">
  </div>

  <script type="module">
    import mqtt from 'https://unpkg.com/mqtt/dist/mqtt.esm.js';

    // random anonymous id
    const uid = Math.random().toString(36).slice(2, 10);
    document.getElementById('uid').textContent = 'id: ' + uid;
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    const inp = document.getElementById('inp');

    const T_MSG = 'voidbox/m/v2';
    const T_PRES = 'voidbox/p/v2';
    const HB = 4000;      // heartbeat every 4s
    const TO = 12000;     // user timeout 12s

    const msgs = new Map();      // msgId -> {el, uid}
    const userMsgs = new Map();  // uid -> Set(msgId)
    const users = new Map();     // uid -> lastSeen

    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
      clientId: 'v_' + uid + '_' + Date.now(),
      clean: true,
      reconnectPeriod: 3000,
    });

    client.on('connect', () => {
      statusEl.textContent = 'online';
      statusEl.style.color = '#0f0';
      client.subscribe([T_MSG, T_PRES]);
      beat();
    });

    client.on('disconnect', () => {
      statusEl.textContent = 'offline';
      statusEl.style.color = '#f00';
    });

    client.on('error', () => {
      statusEl.textContent = 'error';
      statusEl.style.color = '#f00';
    });

    client.on('message', (topic, payload) => {
      try {
        const d = JSON.parse(payload.toString());
        if (topic === T_MSG) onMsg(d);
        if (topic === T_PRES) onPres(d);
      } catch(e) {}
    });

    function onMsg(d) {
      if (!d.u || !d.t || !d.m) return;
      if (msgs.has(d.m)) return;

      const el = document.createElement('div');
      el.className = 'msg';
      const tm = new Date(d.ts).toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
      el.innerHTML = `<div class="json-comment">// ${d.u.slice(0,6)} @ ${tm}</div>{<br>&nbsp;&nbsp;<span class="json-key">"from"</span>: <span class="json-str">"${esc(d.u)}"</span>,<br>&nbsp;&nbsp;<span class="json-key">"text"</span>: <span class="json-str">"${esc(d.t)}"</span>,<br>&nbsp;&nbsp;<span class="json-key">"time"</span>: <span class="json-str">"${tm}"</span><br>}`;
      logEl.appendChild(el);
      logEl.scrollTop = logEl.scrollHeight;

      msgs.set(d.m, {el, u: d.u});
      if (!userMsgs.has(d.u)) userMsgs.set(d.u, new Set());
      userMsgs.get(d.u).add(d.m);
    }

    function onPres(d) {
      if (!d.u) return;
      users.set(d.u, Date.now());
      updateStatus();
    }

    function beat() {
      client.publish(T_PRES, JSON.stringify({u: uid, ts: Date.now()}));
    }
    setInterval(beat, HB);
    setInterval(checkUsers, 5000);

    function checkUsers() {
      const now = Date.now();
      let changed = false;
      for (const [id, last] of users) {
        if (now - last > TO) {
          if (userMsgs.has(id)) {
            for (const mid of userMsgs.get(id)) {
              if (msgs.has(mid)) {
                const o = msgs.get(mid);
                o.el.classList.add('out');
                setTimeout(() => o.el.remove(), 400);
                msgs.delete(mid);
              }
            }
            userMsgs.delete(id);
          }
          users.delete(id);
          changed = true;
        }
      }
      if (changed) updateStatus();
    }

    function updateStatus() {
      statusEl.textContent = 'online | ' + users.size + ' active';
    }

    function send() {
      const t = inp.value.trim();
      if (!t) return;
      const mid = uid + '_' + Date.now();
      client.publish(T_MSG, JSON.stringify({u: uid, m: mid, t: t, ts: Date.now()}));
      inp.value = '';
    }

    inp.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

    function esc(s) {
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  </script>
</body>
</html>
